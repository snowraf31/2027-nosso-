<title>Harbor &amp; Pine Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Caveat:wght@500;600&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&family=Bagel+Fat+One&family=Permanent+Marker&display=swap">
<style>
/* =====================================================================
   Tabletop · Guest menu
   Idea: a sunny Florida café counter. Sage paper, palm-green ink,
   guava and mango accents, hand-drawn doodles and handwritten notes
   from the staff. Modern grotesque type that leans narrow and friendly.
   ===================================================================== */
:root {
  --paper: #f2f4ee; --card: #ffffff; --ink: #152b23; --ink-2: #2e463c; --muted: #5d6b64; --line: #dce2d8;
  --guava: #cc3c53; --guava-soft: #fbe4e6; --mango: #f2b33d; --mango-ink: #3b2a05;
  --btn: #152b23; --btn-ink: #f6f8f2;
  --tint-1: #eadbc8; --tint-2: #f7e1a0; --tint-3: #f5cdcf; --tint-4: #d4e6c4;
  --danger: #b3402f; --ok: #2e7d5b;
  --shadow: 0 1px 0 rgba(21, 43, 35, .05), 0 12px 28px -18px rgba(21, 43, 35, .45);
  --scrim: rgba(13, 24, 20, .48);

  --kds-bg: #141917; --kds-col: #1c2321; --kds-card: #262f2b; --kds-ink: #e9efeb; --kds-muted: #94a49c; --kds-line: #33403a;
  --st-new: #e3a63b; --st-prep: #5ea3da; --st-ready: #5dbb83; --st-late: #e2615c;

  --f-display: var(--font-display, "Bricolage Grotesque"), "Arial Narrow", system-ui, sans-serif;
  --f-body: var(--font-body, "Instrument Sans"), system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: var(--font-hand, "Caveat"), "Bradley Hand", "Segoe Print", cursive;
  --f-mono: var(--font-mono, "JetBrains Mono"), ui-monospace, Menlo, Consolas, monospace;
  --w-display: 700; --stretch-display: 85%; --track-display: -.03em;
  --hand-size: 1;
  --hero-bg: transparent; --hero-ink: var(--ink); --hero-accent: var(--guava); --hero-muted: var(--muted);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1512; --card: #16211c; --ink: #e8efea; --ink-2: #c4d2ca; --muted: #93a39a; --line: #26332d;
    --guava: #f27c8e; --guava-soft: #3a1f25; --mango: #f2b33d; --mango-ink: #2a1d02;
    --btn: #e8efea; --btn-ink: #0e1512;
    --tint-1: #3a2e23; --tint-2: #3c3216; --tint-3: #3d2328; --tint-4: #233321;
    --danger: #f07a68; --ok: #6fcf9f;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1512; --card: #16211c; --ink: #e8efea; --ink-2: #c4d2ca; --muted: #93a39a; --line: #26332d;
  --guava: #f27c8e; --guava-soft: #3a1f25; --mango: #f2b33d; --mango-ink: #2a1d02;
  --btn: #e8efea; --btn-ink: #0e1512;
  --tint-1: #3a2e23; --tint-2: #3c3216; --tint-3: #3d2328; --tint-4: #233321;
  --danger: #f07a68; --ok: #6fcf9f;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -18px rgba(0, 0, 0, .8);
  --scrim: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

/* ---------------------------------------------------------------------
   Brand style: "diner" (burger joints, lanchonetes)
   Butcher-paper white, charcoal, ketchup and mustard, pickle green.
   Chunky display type and sharpie handwriting.
   --------------------------------------------------------------------- */
:root:has(.g[data-brand="diner"]) {
  --paper: #f6f3ee; --card: #ffffff; --ink: #1f1a17; --ink-2: #463b34; --muted: #6f635b; --line: #e4ddd4;
  --guava: #d93a26; --guava-soft: #fce1da; --mango: #ffc233; --mango-ink: #2b1d00;
  --btn: #1f1a17; --btn-ink: #fbf7f0;
  --tint-1: #ffe08a; --tint-2: #f8c9be; --tint-3: #d5e3a8; --tint-4: #eed3aa;
  --hero-bg: #ffc233; --hero-ink: #1f1a17; --hero-accent: #c2311f; --hero-muted: #4a3a20;
  --f-display: var(--font-diner-display, "Bagel Fat One"), "Arial Black", system-ui, sans-serif;
  --f-hand: var(--font-diner-hand, "Permanent Marker"), "Marker Felt", "Comic Sans MS", cursive;
  --w-display: 400; --stretch-display: 100%; --track-display: 0em; --hand-size: .86;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):has(.g[data-brand="diner"]) {
    --paper: #15120f; --card: #201b17; --ink: #f4eee6; --ink-2: #d6ccc0; --muted: #a2958a; --line: #332b25;
    --guava: #ff6a52; --guava-soft: #3b1e18; --mango: #ffc233; --mango-ink: #2b1d00;
    --btn: #ffc233; --btn-ink: #1f1a17;
    --tint-1: #4a3a12; --tint-2: #47231c; --tint-3: #2f3a1a; --tint-4: #43331f;
  }
}
:root[data-theme="dark"]:has(.g[data-brand="diner"]) {
  --paper: #15120f; --card: #201b17; --ink: #f4eee6; --ink-2: #d6ccc0; --muted: #a2958a; --line: #332b25;
  --guava: #ff6a52; --guava-soft: #3b1e18; --mango: #ffc233; --mango-ink: #2b1d00;
  --btn: #ffc233; --btn-ink: #1f1a17;
  --tint-1: #4a3a12; --tint-2: #47231c; --tint-3: #2f3a1a; --tint-4: #43331f;
}
.g[data-brand="diner"] .g-hero { border-radius: 0 0 32px 32px; padding-bottom: 26px; }
.g[data-brand="diner"] .g-hero .g-table { background: var(--hero-ink); color: var(--hero-bg); }
.g[data-brand="diner"] .g-tile svg { transform: rotate(-7deg); }
.g[data-brand="diner"] .g-dish:nth-child(even) .g-tile svg { transform: rotate(6deg); }
.g[data-brand="diner"] .g-stamp { background: var(--guava); color: #fff; }
.g[data-brand="diner"] .g-cartbar-n { background: var(--mango); color: var(--mango-ink); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2.5px solid var(--guava); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }

/* ---------- shared bits ---------- */
.g { max-width: 560px; margin: 0 auto; min-height: 100dvh; background: var(--paper); padding-bottom: 128px; position: relative; }
.g-pad { padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
.g-hand { font-family: var(--f-hand); font-weight: 500; font-size: calc(21px * var(--hand-size)); line-height: 1.15; color: var(--guava); }
.g-label { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.g-muted { color: var(--muted); }
.g-price { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.g-price.lg { font-family: var(--f-display); font-size: 22px; font-weight: var(--w-display); }
.g-link { border: 0; background: none; padding: 6px 2px; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--guava); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.g-table { font-size: 12.5px; font-weight: 600; background: var(--ink); color: var(--paper); padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.g-brand { font-family: var(--f-display); font-weight: var(--w-display); font-size: 15px; letter-spacing: var(--track-display); }

.g-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 650; font-size: 15.5px; background: var(--btn); color: var(--btn-ink); transition: transform .12s ease; }
.g-btn:active:not(:disabled) { transform: scale(.97); }
.g-btn:disabled { opacity: .5; }
.g-btn.block { width: 100%; }
.g-btn.big { padding: 18px 22px; font-size: 16.5px; border-radius: 20px; }
.g-btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.g-btn-sum { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 600; }

.g-stamp { display: inline-block; vertical-align: 2px; margin-left: 8px; background: var(--mango); color: var(--mango-ink); font-family: var(--f-body); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px 2px; border-radius: 4px; transform: rotate(-3deg); white-space: nowrap; }
.g-stamp.big { position: absolute; top: 16px; left: 18px; margin: 0; font-size: 11.5px; padding: 5px 9px 4px; transform: rotate(-4deg); box-shadow: 0 2px 0 rgba(0,0,0,.08); }

.g-tile { width: 68px; height: 68px; border-radius: 18px; display: grid; place-items: center; overflow: hidden; color: var(--ink); flex: none; }
.g-tile svg { width: 40px; height: 40px; }
.g-tile img { width: 100%; height: 100%; object-fit: cover; }
.g-tile.sm { width: 46px; height: 46px; border-radius: 13px; }
.g-tile.sm svg { width: 28px; height: 28px; }
[data-tint="1"] { background: var(--tint-1); }
[data-tint="2"] { background: var(--tint-2); }
[data-tint="3"] { background: var(--tint-3); }
[data-tint="4"] { background: var(--tint-4); }

/* ---------- hero ---------- */
.g-hero { background: var(--hero-bg); color: var(--hero-ink); padding: calc(18px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 8px max(20px, env(safe-area-inset-left)); }
.g-hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.g-hello { font-family: var(--f-display); font-weight: var(--w-display); font-stretch: var(--stretch-display); font-size: clamp(38px, 11vw, 50px); line-height: .94; letter-spacing: var(--track-display); margin: 26px 0 0; text-wrap: balance; }
.g-hello-1 { display: block; }
.g-hello-2 { display: block; color: var(--hero-accent); }
.g-tagline { margin: 12px 0 0; color: var(--hero-muted); font-size: 14.5px; max-width: 34ch; }
.g-hero .g-hand { color: var(--hero-accent); }
.g-hint { margin: 10px 0 0; transform: rotate(-1.5deg); transform-origin: left; }

.g-track { display: flex; align-items: center; gap: 10px; margin: 14px max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); padding: 12px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
.g-track-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); animation: g-pulse 1.8s ease-in-out infinite; }
.g-track-go { margin-left: auto; font-weight: 700; }

/* ---------- moods & diets ---------- */
.g-moods { padding: 22px 0 4px; }
.g-moods .g-label { padding-inline: max(20px, env(safe-area-inset-left)); }
.g-mood-row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px max(20px, env(safe-area-inset-right)) 4px max(20px, env(safe-area-inset-left)); scroll-snap-type: x proximity; scroll-padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
.g-mood-row::-webkit-scrollbar { display: none; }
.g-mood { flex: none; width: 116px; display: grid; gap: 10px; justify-items: start; text-align: left; padding: 14px 14px 13px; border: 0; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); font-weight: 600; font-size: 14px; line-height: 1.2; scroll-snap-align: start; transition: background .15s ease, color .15s ease, transform .12s ease; }
.g-mood:active { transform: scale(.96); }
.g-mood-doodle { width: 34px; height: 34px; }
.g-mood[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.g-diets { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); }
.g-diet { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.g-diet[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* ---------- featured ---------- */
.g-feature { position: relative; margin: 22px max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); border-radius: 28px; padding: 56px 22px 20px; overflow: hidden; }
.g-feature-doodle { position: absolute; right: 8px; top: 10px; width: 92px; height: 92px; opacity: .9; transform: rotate(8deg); }
.g-feature-name { position: relative; font-family: var(--f-display); font-weight: var(--w-display); font-stretch: var(--stretch-display); font-size: 34px; line-height: .98; letter-spacing: var(--track-display); margin: 0; max-width: 11ch; }
.g-feature-story { position: relative; margin: 10px 0 0; color: var(--ink-2); max-width: 24ch; font-size: 22px; }
.g-feature-foot { position: relative; display: flex; align-items: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
.g-feature-foot .g-btn { margin-left: auto; }

.g-anchor { display: block; scroll-margin-top: 12px; }
.g-filtering { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); padding: 10px 14px; border-radius: 14px; background: var(--guava-soft); font-size: 14px; }

/* ---------- tabs ---------- */
.g-tabs { position: sticky; top: 0; z-index: 6; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 22px; padding: calc(10px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left)); background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.g-tabs::-webkit-scrollbar { display: none; }
.g-tabs button { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14.5px; color: var(--muted); white-space: nowrap; }
.g-tabs button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.g-tab-dot { width: 9px; height: 9px; border-radius: 50%; }
.g-tabs button[aria-current="true"] .g-tab-dot { box-shadow: 0 0 0 2px var(--paper); }

/* ---------- sections & dishes ---------- */
.g-sec { scroll-margin-top: 70px; padding-top: 26px; }
.g-sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.g-sec-head h2 { font-family: var(--f-display); font-weight: var(--w-display); font-stretch: var(--stretch-display); font-size: 30px; letter-spacing: var(--track-display); line-height: 1; margin: 0; }
.g-sec-note { transform: rotate(-2deg); font-size: 20px; }
.g-dishes { list-style: none; margin: 0; padding: 0; }
.g-dish { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.g-dish:last-child { border-bottom: 0; }
.g-dish-main { display: flex; gap: 14px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 0; min-width: 0; }
.g-dish-body { display: grid; gap: 4px; min-width: 0; padding-top: 2px; }
.g-dish-name { font-weight: 650; font-size: 16.5px; line-height: 1.25; }
.g-dish-desc { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.g-dish-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.g-tag { font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; }
.g-tag.warn { background: color-mix(in srgb, var(--mango) 22%, transparent); border-color: color-mix(in srgb, var(--mango) 55%, transparent); }
.g-dish-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 10px; padding-top: 2px; }
.g-add { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 15px; transition: transform .12s ease, background .15s ease; }
.g-add svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.g-add:active { transform: scale(.9); }
.g-add.has { background: var(--guava); border-color: var(--guava); color: #fff; }
.g-dish.out .g-dish-main { opacity: .45; cursor: default; }
.g-dish.out .g-price { opacity: .45; text-decoration: line-through; }
.g-soldout { font-size: 19px; transform: rotate(-4deg); }
.g-sign { text-align: center; margin: 40px 0 0; transform: rotate(-2deg); color: var(--muted); }

.g-empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 40px 0 10px; color: var(--muted); }
.g-empty p { margin: 0; font-size: 15px; }
.g-empty-doodle { width: 64px; height: 64px; color: var(--ink-2); }

/* ---------- cart bar & toast ---------- */
.g-cartbar { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 28px)); display: flex; align-items: center; gap: 12px; border: 0; border-radius: 22px; padding: 12px 18px 12px 12px; background: var(--btn); color: var(--btn-ink); font-weight: 650; font-size: 16px; box-shadow: 0 16px 32px -16px rgba(0,0,0,.55); }
.g-cartbar.bump { animation: g-bump .38s cubic-bezier(.3,1.6,.5,1); }
.g-cartbar-n { min-width: 36px; height: 36px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; background: var(--guava); color: #fff; font-variant-numeric: tabular-nums; }
.g-cartbar-sum { margin-left: auto; font-variant-numeric: tabular-nums; }

.g-toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(98px + env(safe-area-inset-bottom)); width: min(520px, calc(100% - 28px)); display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 18px 40px -18px rgba(0,0,0,.5), 0 0 0 1px var(--line); animation: g-rise .28s ease-out; }
.g-toast-check { width: 26px; height: 26px; padding: 4px; border-radius: 50%; background: var(--ok); stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.g-toast-text { display: grid; min-width: 0; font-size: 14px; }
.g-toast-text span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-toast button { margin-left: auto; flex: none; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--guava-soft); color: var(--ink); font-weight: 650; font-size: 13.5px; }

/* ---------- item sheet ---------- */
.g-sheet-bg { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: g-fade .2s ease-out; }
.g-sheet { width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--paper); border-radius: 28px 28px 0 0; overflow: hidden; animation: g-up .32s cubic-bezier(.2,.9,.3,1); }
.g-sheet-band { position: relative; flex: none; height: 132px; display: grid; place-items: center; }
.g-sheet-band img { width: 100%; height: 100%; object-fit: cover; }
.g-sheet-doodle { width: 92px; height: 92px; color: var(--ink); transform: rotate(-6deg); }
.g-close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); display: grid; place-items: center; }
.g-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.g-sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 18px 22px 12px; display: grid; gap: 14px; }
.g-sheet-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.g-sheet-title h3 { font-family: var(--f-display); font-weight: var(--w-display); font-stretch: var(--stretch-display); font-size: 32px; line-height: 1; letter-spacing: var(--track-display); margin: 0; }
.g-sheet-desc { margin: 0; color: var(--ink-2); font-size: 15px; }
.g-quote { margin: 0; padding: 12px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); display: grid; gap: 2px; }
.g-quote .g-hand { color: var(--ink); font-size: 22px; }
.g-quote-by { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.g-allergens { margin: 0; font-size: 13px; color: var(--ink-2); padding-left: 12px; border-left: 3px solid var(--mango); }
.g-group { border: 0; margin: 0; padding: 0; min-width: 0; }

.g-progress-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }

@keyframes g-pulse { 50% { box-shadow: 0 0 0 7px transparent; } }

@keyframes g-wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

.tk-f button { margin-left: auto; border: 0; border-radius: 8px; padding: 9px 13px; font-weight: 700; font-size: 13.5px; background: var(--kds-ink); color: var(--kds-bg); }

.tog input:not(:checked) { background: var(--kds-line); }
